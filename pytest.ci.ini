[pytest]
# Configuration for CI test runs with pytest-xdist and pytest-shard support
# This config enables coverage, parallelization, and sharding
#
# pytest-xdist: Provides -n auto for parallel execution within a shard
# pytest-shard: Provides --shard-id and --num-shards for distributing tests across CI matrix

addopts =
    --cov
    --cov-config coverage.ini
    --cov-report=html:htmlcov
    # Disable coverage warnings when using xdist
    --no-cov-on-fail
    # Show verbose output for better CI debugging
    -v

testpaths =
    tests

# Test execution notes:
# - Each matrix shard runs: pytest --shard-id=X --num-shards=4 -n auto
# - pytest-shard distributes tests deterministically across shards
# - pytest-xdist parallelizes tests within each shard using all CPU cores
# - Both plugins work together for maximum parallelization efficiency
