[pytest]
# Configuration for CI test runs with pytest-xdist support
# This config enables coverage, parallelization, and sharding

addopts =
    --cov
    --cov-config coverage.ini
    --cov-report=html:htmlcov
    # Disable coverage warnings when using xdist
    --no-cov-on-fail
    # Show verbose output for better CI debugging
    -v

testpaths =
    tests

# pytest-xdist configuration
# Allows tests to run in parallel within each shard and across shards
# Workers are automatically distributed by the -n auto flag
# Each worker runs in isolation to prevent test interference
