name: SimpleLogin actions

on:
  push:
    branches:
      - master
    tags:
      - v*
    # Path filters: Skip workflow for documentation-only changes
    # This saves CI resources when only markdown/docs are modified
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    # Path filters: Only run workflow when app code, scripts, configs, or workflows change
    # Excludes documentation-only PRs to speed up feedback loop
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Concurrency control: Cancel in-progress runs for the same PR/branch
# This prevents wasting CI resources on outdated commits when developers push frequently
# Each PR/branch gets its own concurrency group to avoid cross-contamination
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  UV_VERSION: 0.8.18

jobs:
  # Lint job: Runs formatting and linting checks
  # This job runs in parallel with the test job for faster feedback
  lint:
    # Using ubuntu-22.04: Latest stable LTS runner with better performance
    # and longer support window than ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      # Python/uv setup with built-in caching
      # enable-cache: true leverages uv's native cache management
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # Cache for system dependencies to speed up repeated builds
      # These dependencies rarely change, so caching provides significant speedup
      - name: Cache system dependencies
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install OS dependencies
        run: |
          sudo apt update
          sudo apt install -y libre2-dev libpq-dev

      # Additional cache for uv's virtual environment and installed packages
      # This dramatically speeds up dependency installation across runs
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Check formatting & linting
        run: |
          uv run pre-commit run --all-files

  # Test job: Runs the test suite with parallelization
  # Uses a matrix strategy to split tests into 4 shards for maximum speed
  # Each shard runs independently and in parallel with other shards
  test:
    # Using ubuntu-22.04: Latest stable LTS runner
    runs-on: ubuntu-22.04

    # Matrix strategy: Splits test suite into 4 parallel shards
    # This reduces total test time by ~4x (minus overhead)
    # Each shard runs a subset of tests determined by pytest-xdist
    strategy:
      # fail-fast: true stops all shards if any shard fails
      # This provides faster feedback and saves CI resources on failures
      fail-fast: true
      matrix:
        # 4 shards provides good balance between parallelization gains
        # and CI runner availability/cost
        shard: [1, 2, 3, 4]

    # Service containers: Postgres and Redis for integration tests
    # These are real services (not mocks) to ensure tests match production behavior
    # Note: Each matrix shard gets its own isolated service container instance
    services:
      # Postgres 13: Production-like database for testing
      # Each test shard connects to its own postgres instance to avoid conflicts
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: test
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
        ports:
          - 15432:5432
        # Health checks ensure postgres is ready before tests start
        # This prevents flaky test failures due to connection issues
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      # Python/uv setup with built-in caching
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # Cache for system dependencies
      - name: Cache system dependencies
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install OS dependencies
        run: |
          sudo apt update
          sudo apt install -y libre2-dev libpq-dev

      # Cache for uv packages - critical for test performance
      # Each shard benefits from this shared cache
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # Install pytest-xdist and pytest-shard for test parallelization and sharding
      # pytest-xdist: Enables parallel test execution within each shard using -n auto
      # pytest-shard: Provides --shard-id and --num-shards for distributing tests across matrix runners
      - name: Install pytest plugins for parallelization
        run: |
          uv pip install pytest-xdist pytest-shard

      # Redis v6: Real Redis instance for caching/session tests
      # Each matrix shard gets its own Redis to prevent test interference
      - name: Start Redis v6
        uses: superchargejs/redis-github-action@1.1.0
        with:
          redis-version: 6

      # Database migration: Set up schema before tests
      - name: Run db migration
        run: |
          CONFIG=tests/test.env uv run alembic upgrade head

      # Generate build info for tests that may depend on version metadata
      - name: Prepare version file
        run: |
          scripts/generate-build-info.sh ${{ github.sha }} ${{ github.ref_name }}
          cat app/build_info.py

      # Run tests with pytest-xdist and pytest-shard
      # pytest-shard: --shard-id and --num-shards distribute tests across matrix runners
      #   Each shard gets a deterministic subset of tests (same tests on same shard every time)
      # pytest-xdist: -n auto uses all available CPU cores within each shard for additional speedup
      #   This provides two levels of parallelization: across shards (matrix) and within shards (xdist)
      - name: Test with pytest (shard ${{ matrix.shard }}/4)
        run: |
          uv run pytest -c pytest.ci.ini --shard-id=${{ matrix.shard }} --num-shards=4 -n auto
        env:
          GITHUB_ACTIONS_TEST: true

      # Archive coverage per shard for potential merge/analysis later
      # Each shard produces its own coverage report
      # In a follow-up job, these could be combined for complete coverage
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-shard-${{ matrix.shard }}
          path: htmlcov
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    needs: ['test', 'lint']
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: simplelogin/app-ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      # We need to checkout the repository in order for the "Create Sentry release" to work
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          ignore_missing: true
          ignore_empty: true

      - name: Prepare version file
        run: |
          scripts/generate-build-info.sh ${{ github.sha }} ${{ github.ref_name }}
          cat app/build_info.py

      - name: Build image and publish to Docker Registry
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}


      #- name: Send Telegram message
      #  uses: appleboy/telegram-action@master
      #  with:
      #    to: ${{ secrets.TELEGRAM_TO }}
      #    token: ${{ secrets.TELEGRAM_TOKEN }}
      #    args: Docker image pushed on ${{ github.ref }}

      # If we have generated a tag, generate the changelog, send a notification to slack and create the GitHub release
      - name: Build Changelog
        id: build_changelog
        if: startsWith(github.ref, 'refs/tags/v')
        uses: mikepenz/release-changelog-builder-action@v3
        with:
          configuration: ".github/changelog_configuration.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Slack notification contents
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          changelog=$(cat << EOH
          ${{ steps.build_changelog.outputs.changelog }}
          EOH
          )
          messageWithoutNewlines=$(echo "${changelog}" | awk '{printf "%s\\n", $0}')
          messageWithoutDoubleQuotes=$(echo "${messageWithoutNewlines}" | sed "s/\"/'/g")
          echo "${messageWithoutDoubleQuotes}"

          echo "SLACK_CHANGELOG=${messageWithoutDoubleQuotes}" >> $GITHUB_ENV

      - name: Post notification to Slack
        uses: slackapi/slack-github-action@v1.19.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "New tag created",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Tag: ${{ github.ref_name }}* (${{ github.sha }})"
                    }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Changelog:*\n${{ env.SLACK_CHANGELOG }}"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
